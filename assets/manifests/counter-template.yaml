apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter
  annotations:
    kubernetes.io/change-cause: "${VERSION} (${STRATEGY})"
spec:
  replicas: ${REPLICAS}
  revisionHistoryLimit: 10
  minReadySeconds: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: counter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: ${MAX_SURGE}
      maxUnavailable: ${MAX_UNAVAILABLE}
  template:
    metadata:
      labels:
        app: counter
        version: ${VERSION}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: counter
          image: counter:${VERSION}
          imagePullPolicy: Never  # built locally
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_HOST
              value: ${REDIS_HOST}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          lifecycle:
            preStop:
              # keep serving while the pod is removed from the endpoints
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 160Mi